<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taneleer — Forthcoming</title>
  <meta name="description" content="The collection, properly kept. A desktop archivist for digital comics, presently in production.">
  <meta name="theme-color" content="#070604">
  <meta name="robots" content="noindex,nofollow">

  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="holding">

    <div class="reticle" aria-hidden="true">
      <div class="reticle-ring outer"></div>
      <div class="reticle-ring inner"></div>
      <div class="reticle-cross h"></div>
      <div class="reticle-cross v"></div>
    </div>

    <header class="sys">TNLR // Comic Archive Management</header>

    <main class="centre">
      <div class="mark-row">
        <svg class="mark" viewBox="0 0 40 40" width="80" height="80" aria-hidden="true">
          <g fill="none" stroke="#c07818" stroke-width="2">
            <path d="M 1 11 L 1 1 L 11 1"/>
            <path d="M 29 1 L 39 1 L 39 11"/>
            <path d="M 39 29 L 39 39 L 29 39"/>
            <path d="M 11 39 L 1 39 L 1 29"/>
          </g>
          <g fill="#f0c060">
            <rect x="11" y="6.5" width="10.5" height="10.5"/>
            <rect x="23" y="6.5" width="6" height="10.5"/>
            <rect x="11" y="18.5" width="6" height="15"/>
            <rect x="18.5" y="18.5" width="10.5" height="15"/>
          </g>
        </svg>
        <h1 class="wordmark">Taneleer</h1>
      </div>

      <p class="byline">The collection, properly kept.</p>

      <div class="status">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="status-label">Forthcoming.</span>
      </div>

      <p class="ledger">A desktop archivist for digital comics, presently in production. When it is fit to release, it will appear here.</p>
    </main>

    <footer class="ledger-foot">
      <span>v0.5 — 2026</span>
      <span>taneleer.app</span>
    </footer>

  </div>

</body>
</html>
